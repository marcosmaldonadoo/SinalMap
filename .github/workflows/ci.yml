name: Phase 0 build and simulated tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SinalMap.sln
      - run: dotnet build SinalMap.sln -c Release --no-restore
      - run: dotnet test SinalMap.sln -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-tests-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
