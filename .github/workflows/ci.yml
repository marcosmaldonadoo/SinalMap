name: Console, apresentação e WPF — compilação e testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: tests/SinalMap.Tests/SinalMap.Tests.csproj
          - os: windows-latest
            target: SinalMap.sln
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ${{ matrix.target }}
      - run: dotnet build ${{ matrix.target }} -c Release --no-restore
      - run: dotnet test ${{ matrix.target }} -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-tests-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
